function formatMoney(val) {
    const num = Number(val || 0);
    if (num < 1e6) return num.toLocaleString("vi-VN") + " VNĐ";
    const units = [
        { v: 1e303, s: "Centillion" }, { v: 1e120, s: "Novemdec" }, { v: 1e117, s: "Octodec" }, { v: 1e114, s: "Septendec" }, { v: 1e111, s: "Sexdec" },

        { v: 1e48,  s: "Quind" }, { v: 1e45,  s: "Quatd" }, { v: 1e42,  s: "Tredec" }, { v: 1e39,  s: "Duodec" }, { v: 1e36,  s: "Undec" }, 
        { v: 1e33,  s: "Dec" }, { v: 1e30,  s: "Q" }, { v: 1e27,  s: "R" }, { v: 1e24,  s: "Y" }, { v: 1e21,  s: "Z" }, 
        { v: 1e18,  s: "E" }, { v: 1e15,  s: "P" }, { v: 1e12,  s: "T" }, { v: 1e9,   s: "G" }, { v: 1e6,   s: "M" }
    ];
    if (num >= 1e306) return "INFINITY VNĐ";
    for (let i = 0; i < units.length; i++) {
        if (num >= units[i].v) { const scaled = num / units[i].v; return scaled.toFixed(scaled >= 100 ? 0 : (scaled >= 10 ? 1 : 2)) + " " + units[i].s; }
    }
    return num.toLocaleString("vi-VN") + " VNĐ";
}

class MasterpieceArtRenderer {
    constructor(tier, type) { this.tier = Math.max(1, tier); this.type = type; }
    circle(ctx, r, fill, stroke, lw) { ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } }

    spin(ctx, count, fn) { for (let i = 0; i < count; i++) { ctx.save(); ctx.rotate((i * Math.PI * 2) / count); fn(i); ctx.restore(); } }

            } else {

            }
            if (this.type === 'auras') this.renderAuras(ctx, time, rA); else if (this.type === 'weapons') this.renderWeapons(ctx, time, rW, isShopPreview, radius);
        } catch (err) { } finally { ctx.restore(); }
    }
    renderAuras(ctx, time, s) {
        ctx.rotate(time * (0.3 + (this.tier % 5) * 0.05)); const t = (this.tier - 1) % 25; const baseType = t % 5;
        const cols = ['#007fff', '#ff3838', '#ffd700', '#9b59b6', '#00f7ff']; const c1 = cols[t % 5]; const c2 = cols[(t + 2) % 5]; const rings = 1 + Math.floor(t / 5);

        else if (baseType === 1) { const grad = ctx.createRadialGradient(0,0,s*0.2, 0,0,s); grad.addColorStop(0, c1); grad.addColorStop(1, 'transparent'); this.circle(ctx, s, grad, null, 0); this.circle(ctx, s*0.4, '#000', null, 0); ctx.save(); ctx.rotate(time); ctx.beginPath(); ctx.ellipse(0,0, s*1.2, s*0.2, 0, 0, Math.PI*2); ctx.strokeStyle = c2; ctx.lineWidth = 15; ctx.stroke(); ctx.restore(); } 
        else if (baseType === 2) { this.circle(ctx, s*0.2, c1, null, 0); this.spin(ctx, 2 + rings, (i) => { ctx.beginPath(); ctx.ellipse(0,0, s, s*0.3, 0, 0, Math.PI*2); ctx.strokeStyle = c2; ctx.lineWidth = 2; ctx.stroke(); ctx.beginPath(); ctx.arc(s * Math.cos(time*3+i), s*0.3 * Math.sin(time*3+i), 5, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); }); } 
        else if (baseType === 3) { this.spin(ctx, 4 + rings*2, (i) => { ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(s*0.5, s*0.5, s, 0); ctx.quadraticCurveTo(s*0.5, -s*0.5, 0, 0); ctx.fillStyle = c1; ctx.globalAlpha = 0.4; ctx.fill(); ctx.globalAlpha = 1.0; ctx.strokeStyle=c2; ctx.lineWidth=2; ctx.stroke(); }); } 
        else if (baseType === 4) { ctx.setLineDash([5, 10]); for(let i=1; i<=rings+1; i++) { this.circle(ctx, s * (i/(rings+1)), null, c2, 2); } ctx.setLineDash([]); this.spin(ctx, 6, (i) => { ctx.beginPath(); ctx.moveTo(s*0.2, 0); ctx.lineTo(s, 0); ctx.strokeStyle=c1; ctx.lineWidth=2; ctx.stroke(); }); }
    }

        const t = (this.tier - 1) % 25; const baseType = t % 5; const cols = ['#ecf0f1', '#ff4757', '#00f7ff', '#f1c40f', '#9b59b6'];
        const mainCol = cols[t % 5]; const glowCol = cols[(t + 2) % 5]; const hasExtraBlades = t > 9; const hasParticles = t > 4; const hasEnergyCore = t > 14;
        ctx.fillStyle = mainCol; ctx.strokeStyle = glowCol;
        if (baseType === 0) { ctx.fillRect(-w*0.1, -w, w*0.2, w*1.5); ctx.beginPath(); ctx.moveTo(-w*0.1, -w); ctx.lineTo(0, -w*1.2); ctx.lineTo(w*0.1, -w); ctx.fill(); ctx.fillStyle = '#2d3436'; ctx.fillRect(-w*0.4, -w*0.2, w*0.8, w*0.1); ctx.fillStyle = mainCol; if (hasExtraBlades) { ctx.beginPath(); ctx.moveTo(-w*0.4, -w*0.2); ctx.lineTo(-w*0.5, -w*0.6); ctx.lineTo(-w*0.1, -w*0.4); ctx.fill(); ctx.beginPath(); ctx.moveTo(w*0.4, -w*0.2); ctx.lineTo(w*0.5, -w*0.6); ctx.lineTo(w*0.1, -w*0.4); ctx.fill(); } }

        else if (baseType === 2) { ctx.fillStyle = '#2d3436'; ctx.fillRect(-w*0.05, -w*1.2, w*0.1, w*2); ctx.fillStyle = mainCol; ctx.beginPath(); ctx.moveTo(0, -w*1.1); ctx.quadraticCurveTo(-w*1.5, -w*1.2, -w*1.8, 0); ctx.quadraticCurveTo(-w, -w*0.8, 0, -w*0.9); ctx.fill(); if (hasExtraBlades) { ctx.beginPath(); ctx.moveTo(0, w*0.8); ctx.quadraticCurveTo(-w*0.8, w*0.9, -w, w*0.2); ctx.quadraticCurveTo(-w*0.5, w*0.6, 0, w*0.7); ctx.fill(); } } 
        else if (baseType === 3) { ctx.fillStyle = '#2d3436'; ctx.fillRect(-w*0.08, -w*0.8, w*0.16, w*1.6); ctx.fillStyle = mainCol; ctx.beginPath(); ctx.moveTo(0, -w*0.6); ctx.quadraticCurveTo(-w*1.2, -w*0.8, -w, -w*0.2); ctx.quadraticCurveTo(-w*0.5, 0, 0, -w*0.2); ctx.fill(); if (hasExtraBlades) { ctx.beginPath(); ctx.moveTo(0, -w*0.6); ctx.quadraticCurveTo(w*1.2, -w*0.8, w, -w*0.2); ctx.quadraticCurveTo(w*0.5, 0, 0, -w*0.2); ctx.fill(); } } 
        else if (baseType === 4) { ctx.fillStyle = '#2d3436'; ctx.fillRect(-w*0.06, -w*0.5, w*0.12, w*1.5); ctx.fillStyle = mainCol; ctx.beginPath(); ctx.arc(0, -w*0.6, w*0.3, 0, Math.PI*2); ctx.fill(); if (hasEnergyCore) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -w*0.6, w*0.15, 0, Math.PI*2); ctx.fill(); } }
        if (hasParticles) { ctx.fillStyle = glowCol; for (let i=0; i<3; i++) { ctx.beginPath(); ctx.arc(Math.cos(time*5+i)*w*0.5, -w*0.5 + Math.sin(time*4+i)*w*0.5, w*0.05, 0, Math.PI*2); ctx.fill(); } }
    }
}

class SoundEngine {
    constructor() { this.ctx = null; this.volume = 0.5; this.musicPlaying = true; this.currentTrackId = -1; }
    init(labId = 0) { try { if(!this.ctx) { this.ctx=new (window.AudioContext||window.webkitAudioContext)(); } if(this.ctx.state==="suspended") this.ctx.resume(); this.switchBGM(labId); } catch(e){} }
    switchBGM(labId) { if (this.currentTrackId === labId) return; this.currentTrackId = labId; const b = document.getElementById("bgm-stardew"); if (b) { b.src = `music_${labId}.mp3`; b.load(); b.volume = this.volume; if (this.musicPlaying) b.play().catch(()=>{}); } }
    playPop() { try { if(!this.ctx||this.volume<=0)return; const o=this.ctx.createOscillator(), g=this.ctx.createGain(); o.frequency.setValueAtTime(520,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(820,this.ctx.currentTime+0.07); g.gain.setValueAtTime(this.volume*0.25,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+0.07); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+0.07); } catch(e){} }
    playCoin() { try { if(!this.ctx||this.volume<=0)return; const o=this.ctx.createOscillator(), g=this.ctx.createGain(); o.type="triangle"; o.frequency.setValueAtTime(880,this.ctx.currentTime); o.frequency.setValueAtTime(1320,this.ctx.currentTime+0.08); g.gain.setValueAtTime(this.volume*0.3,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+0.16); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+0.16); } catch(e){} }
    playMutate() { try { if(!this.ctx||this.volume<=0)return; [440,554,659,880].forEach((f,i)=>{ const o=this.ctx.createOscillator(), g=this.ctx.createGain(); o.frequency.setValueAtTime(f,this.ctx.currentTime+i*0.06); g.gain.setValueAtTime(this.volume*0.25,this.ctx.currentTime+i*0.06); g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+i*0.06+0.1); o.connect(g); g.connect(this.ctx.destination); o.start(this.ctx.currentTime+i*0.06); o.stop(this.ctx.currentTime+i*0.06+0.1); }); } catch(e){} }
    setVolume(d) { this.volume=Math.max(0,Math.min(1,this.volume+d)); const b=document.getElementById("bgm-stardew"); if(b)b.volume=this.volume; }
    toggleMusic() { this.musicPlaying=!this.musicPlaying; const b=document.getElementById("bgm-stardew"); if(b){if(this.musicPlaying)b.play().catch(()=>{}); else b.pause();} }
}

class Particle {
    constructor(x, y, color) { this.x=x; this.y=y; this.color=color; this.life=15+Math.random()*10; this.maxLife=this.life; this.size=1.5+Math.random()*2.5; let a=Math.random()*Math.PI*2, s=0.5+Math.random(); this.vx=Math.cos(a)*s; this.vy=Math.sin(a)*s-0.5; }
    update(dt, spd=1) { this.x+=this.vx*(dt*60)*spd; this.y+=this.vy*(dt*60)*spd; this.life-=spd; }
    draw(ctx) { ctx.save(); ctx.globalAlpha=Math.max(0,this.life/this.maxLife); ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); ctx.restore(); }
}

class Shockwave {
    constructor(x, y, color) { this.x=x; this.y=y; this.color=color; this.r=5; this.mr=70; this.life=1; }
    update(dt, spd=1) { this.r+=120*dt*spd; this.life=Math.max(0,1-(this.r/this.mr)); }
    draw(ctx) { if(this.life<=0)return; ctx.save(); ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.strokeStyle=this.color; ctx.lineWidth=3*this.life; ctx.globalAlpha=this.life; ctx.stroke(); ctx.restore(); }
}

class AmbientBubble {
    constructor(w, h) { this.w=w; this.h=h; this.reset(); }
    reset() { this.x=Math.random()*this.w; this.y=this.h+20; this.r=2+Math.random()*3; this.s=0.4+Math.random()*0.6; this.wb=Math.random()*Math.PI*2; }
    update(spd=1) { this.y-=this.s*spd; this.wb+=0.03*spd; this.x+=Math.sin(this.wb)*0.2; if(this.y<-20)this.reset(); }
    draw(ctx) { ctx.save(); ctx.strokeStyle="rgba(140,220,255,0.25)"; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
}

class Slime {
    constructor(x, y, labId=0, strainId=null, level=1, repTimer=null) {
        this.x=x||600; this.y=y||380; this.labId=labId;
        const strains=LAB_STRAIN_SETS[this.labId]||LAB_STRAIN_SETS[0];
        this.strain=strainId!==null?(strains.find(s=>s.id===strainId)||strains[0]):strains[0];
        this.level=Math.max(1,parseInt(level)||1); this.radius=32+this.level*3.5;
        this.vx=(Math.random()-0.5)*0.5; this.vy=(Math.random()-0.5)*0.4;
        this.buoyancy=Math.random()*100; this.angle=Math.random()*360; this.rotSpeed=(Math.random()-0.5)*0.3;
        this.blobWobble=Math.random()*100; this.numPoints=12;
        this.locked=false; this.frozen=false; this.isDragged=false; this.isPaused=false;
        this.stretchX=1; this.stretchY=1; this.rotationAngle=Math.random()*Math.PI*2; this.sameCloneCount=0;
        this.customSkin='skin_0'; this.customAura='none';
        const baseVal=Math.floor(Math.random()*400)+450; const lm=1+(this.labId*1.5);
        this.value=Math.floor(baseVal*Math.pow(1.65,this.level-1)*(this.strain.valMult||1)*lm);
        this.timerMax=(6+(this.level-1)*4)*(1+this.labId*0.5);
        this.replicateTimer=repTimer!==null?Number(repTimer):this.timerMax;
    }
    update(dt, wB, eL, sW, spd=1, isLabPaused=false, isCurrentLab=true) {
        this.rotationAngle+=1.5*dt*spd; if(this.isDragged||this.frozen)return null;
        this.buoyancy+=dt*2*spd; this.x+=this.vx*(dt*60)*spd; this.y+=(this.vy+Math.sin(this.buoyancy)*0.2)*(dt*60)*spd;
        this.angle+=this.rotSpeed*(dt*60)*spd; this.blobWobble+=dt*4*spd;
        this.stretchX+=(1-this.stretchX)*0.12; this.stretchY+=(1-this.stretchY)*0.12;
        const p=this.radius+10;
        if(this.x-p<wB.left){this.x=wB.left+p;this.vx=Math.abs(this.vx);} else if(this.x+p>wB.right){this.x=wB.right-p;this.vx=-Math.abs(this.vx);}
        if(this.y-p<wB.top){this.y=wB.top+p;this.vy=Math.abs(this.vy);} else if(this.y+p>wB.bottom){this.y=wB.bottom-p;this.vy=-Math.abs(this.vy);}
        
        if(isCurrentLab && Math.random()<0.03*dt*60*spd)eL.push(new Particle(this.x+(Math.random()-0.5)*this.radius,this.y+(Math.random()-0.5)*this.radius,this.strain.color));
        
        if(!this.locked&&!isLabPaused&&!this.isPaused&&Math.random()<0.00008*dt*spd)return "DEAD";
        if(!isLabPaused && !this.isPaused){ 
            this.replicateTimer-=dt*spd; 
            if(this.replicateTimer<=0){ 
                this.replicateTimer=this.timerMax+(this.sameCloneCount*5); 
                return this.replicate(sW,wB,isCurrentLab); 
            } 
        }
        return null;
    }
    replicate(sW, wB, isCurrentLab) {
        let isMut=false, nId=this.strain.id; const sts=LAB_STRAIN_SETS[this.labId]||LAB_STRAIN_SETS[0];
        for(let g of sts.filter(s=>s.isGod)){ if(Math.random()<(g.mutRate||0.000005)){ nId=g.id; isMut=true; if(isCurrentLab&&sW)sW.push(new Shockwave(this.x,this.y,'#ffd700')); break; } }
        
        if(!isMut&&Math.random()<(this.strain.mutRate||0.05)){ 
            const ops=sts.filter(s=>s.id!==this.strain.id&&!s.isGod); 
            if(ops.length>0){ 
                nId=ops[Math.floor(Math.random()*ops.length)].id; 
                isMut=true; 
                if(isCurrentLab&&sW)sW.push(new Shockwave(this.x,this.y,'#00ffc8')); 
            } 
        }
        let nLvl=1; if(!isMut){ this.sameCloneCount++; nLvl=Math.random()<(Math.max(0.05,0.45-(this.level-1)*0.05))?this.level+1:this.level; } else this.sameCloneCount=0;
        
        let nX=Math.max(wB.left+50,Math.min(wB.right-50,this.x+(Math.random()-0.5)*45)), nY=Math.max(wB.top+50,Math.min(wB.bottom-50,this.y+(Math.random()-0.5)*45));
        return new Slime(nX,nY,this.labId,nId,nLvl);
    }
    draw(ctx) {
        ctx.save(); const r=this.radius; const time=Date.now()*0.003;
        if(this.strain.isGod) {

    gatherAllPets() { const cx=this.worldWidth/2, cy=this.worldHeight/2; this.slimes.forEach(s=>{s.x=cx+(Math.random()-0.5)*150; s.y=cy+(Math.random()-0.5)*150;}); if(this.shockwaves)this.shockwaves.push(new Shockwave(cx,cy,'#00ffc8')); this.sound.playCoin(); }

    setupEvents() {
        const getCanvasPos = (e) => { const rect = this.canvas.getBoundingClientRect(); if(rect.width === 0 || rect.height === 0) return { x: 0, y: 0 }; let cx = e.clientX; let cy = e.clientY; if (cx === undefined && e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; } return { x: (cx - rect.left) * (CANVAS_W / rect.width), y: (cy - rect.top) * (CANVAS_H / rect.height) }; };
        const toWP = (sx,sy) => ({ x:this.camera.x+(sx-(this.containerRect.left+this.containerRect.width/2))/this.camera.zoom, y:this.camera.y+(sy-(this.containerRect.top+this.containerRect.height/2))/this.camera.zoom });

        this.canvas.addEventListener("pointerdown", (e) => {
            e.preventDefault(); this.sound.init(this.currentLabId); this.activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY}); const sc = getCanvasPos(e);
            if (this.activePointers.size === 2) { const p=Array.from(this.activePointers.values()); this.initialPinchDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); this.initialZoom=this.camera.zoom; this.isDraggingCamera=false; this.draggedSlime=null; return; }
            if (this.checkUIClick(sc.x, sc.y)) return;
            if (sc.x>=this.containerRect.left&&sc.x<=this.containerRect.right&&sc.y>=this.containerRect.top&&sc.y<=this.containerRect.bottom) {
                const w = toWP(sc.x, sc.y); let found = false;
                for (let i = this.slimes.length-1; i>=0; i--) {
                    const s = this.slimes[i];
                    if (Math.hypot(s.x-w.x, s.y-w.y)<=Math.max(s.radius*1.5, 45)) { 
                        if (this.giftingTo) {
                            this.confirmModalTitle = `🎁 Gửi tặng ${s.strain.name}`;
                            this.confirmModalSubtitle = `Tặng mức độ nào cho ${this.giftingTo.name}?`;
                            this.pendingConfirmButtons = [
                                { text: "Tặng Lv.1", bg: "#1e648c", action: () => { this.sendGift(s, 1); } },
                                { text: `Tặng Lv.${s.level}`, bg: "#a02832", action: () => { this.sendGift(s, s.level); } },
                                { text: "Hủy bỏ", bg: "#283c50", action: () => { this.giftingTo = null; this.pendingConfirmButtons=null; } }
                            ];
                            found=true; break;
                        } else if (this.pauseState === 2) {
                            s.isPaused = !s.isPaused; this.sound.playPop(); this.saveGame(); found=true; break;
                        } else {
                            this.draggedSlime=s; s.isDragged=true; this.dragStartX=sc.x; this.dragStartY=sc.y; this.isActuallyDragging=false; found=true; break; 
                        }
                    }
                }
                if (!found) { if(this.selectedSlime){this.selectedSlime.frozen=false;this.selectedSlime=null;} this.isDraggingCamera=true; this.lastPanPos={x:e.clientX,y:e.clientY}; }
            }
        }, {passive:false});

        this.canvas.addEventListener("pointermove", (e) => {
            if(!this.activePointers.has(e.pointerId))return; this.activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
            if(this.activePointers.size===2&&this.initialPinchDist){ const p=Array.from(this.activePointers.values()); const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); this.camera.zoom=Math.max(Math.max(this.containerRect.width/this.worldWidth,this.containerRect.height/this.worldHeight),Math.min(5,this.initialZoom*(d/this.initialPinchDist))); this.clampCamera(); return; }
            if(this.draggedSlime){ const sc=getCanvasPos(e); if(Math.hypot(sc.x-this.dragStartX,sc.y-this.dragStartY)>5)this.isActuallyDragging=true; const w=toWP(sc.x,sc.y); this.draggedSlime.x=w.x; this.draggedSlime.y=w.y; return; }
            if(this.isDraggingCamera){ const dx=e.clientX-this.lastPanPos.x, dy=e.clientY-this.lastPanPos.y; this.lastPanPos={x:e.clientX,y:e.clientY}; this.camera.x-=dx/this.camera.zoom; this.camera.y-=dy/this.camera.zoom; this.clampCamera(); }
        });

        window.addEventListener("pointerup", (e) => {
            this.activePointers.delete(e.pointerId); if(this.activePointers.size<2)this.initialPinchDist=null;
            if(this.draggedSlime){ const s=this.draggedSlime; s.isDragged=false; if(!this.isActuallyDragging){if(this.selectedSlime)this.selectedSlime.frozen=false; this.selectedSlime=s; s.frozen=true; this.sound.playPop();} this.draggedSlime=null; }
            this.isDraggingCamera=false;
        });

        this.canvas.addEventListener("wheel", (e) => { e.preventDefault(); this.camera.zoom=Math.max(Math.max(this.containerRect.width/this.worldWidth,this.containerRect.height/this.worldHeight),Math.min(5,this.camera.zoom*(e.deltaY<0?1.15:0.85))); this.clampCamera(); }, {passive:false});
    }

    sendGift(slime, levelToSend) {
        if (!this.db || !this.giftingTo) return;
        this.db.ref('gifts/' + this.giftingTo.id).push({
            fromName: this.playerName, strainId: slime.strain.id, level: levelToSend, labId: this.currentLabId, timestamp: Date.now()
        }).then(() => {
            showCustomAlert(`Gửi tặng thành công đến ${this.giftingTo.name}!`, "success");
            this.slimes = this.slimes.filter(s => s !== slime); this.giftingTo = null; this.pendingConfirmButtons = null; this.saveGame();
        }).catch(err => { showCustomAlert(`Lỗi gửi tặng: ${err.message}`); this.giftingTo = null; this.pendingConfirmButtons = null; });
    }

    drawDynamicBackground(ctx, theme, w, h, xOffset=0, yOffset=0) {
        const time = Date.now() * 0.001; ctx.save(); ctx.translate(xOffset, yOffset); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip(); ctx.fillStyle = theme.bg || theme.containerBg; ctx.fillRect(0, 0, w, h);
        if (theme.id.includes('cosmos') || theme.id.includes('nebula') || theme.id.includes('starlight')) { ctx.translate(w/2, h/2); ctx.rotate(time * 0.05); const maxR = Math.max(w, h); const grad = ctx.createRadialGradient(0,0,0, 0,0, maxR); grad.addColorStop(0, 'rgba(155, 89, 182, 0.15)'); grad.addColorStop(1, 'transparent'); ctx.fillStyle = grad; ctx.fillRect(-maxR, -maxR, maxR*2, maxR*2); for(let i = 0; i < 60; i++) { let r = (Math.sin(i * 999) * 0.5 + 0.5) * maxR; let a = i * 0.8 + time * (0.05 + (i % 5) * 0.01); ctx.fillStyle = `rgba(255,255,255,${Math.sin(time * 2 + i) * 0.5 + 0.5})`; ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, (i % 3) + 1.5, 0, Math.PI * 2); ctx.fill(); } }
        else if (theme.id.includes('magma') || theme.id.includes('inferno')) { ctx.translate(w/2, h/2); ctx.strokeStyle = 'rgba(255, 69, 0, 0.8)'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(0, 0, h * 0.3, 0, Math.PI * 2); ctx.stroke(); ctx.translate(-w/2, -h/2); for(let i = 0; i < 20; i++) { let px = (Math.sin(i * 99) * 0.5 + 0.5) * w; let speed = 20 + (i % 10) * 5; let py = h - ((time * speed + i * 100) % h); ctx.fillStyle = '#ff9f43'; ctx.beginPath(); ctx.arc(px, py, (i % 15) + 3, 0, Math.PI * 2); ctx.fill(); } }
        else if (theme.id.includes('glacier') || theme.id.includes('sky')) { ctx.translate(w/2, h/2); ctx.strokeStyle = '#00a8ff'; ctx.lineWidth = 15; ctx.beginPath(); ctx.arc(0, 0, h * 0.3, 0, Math.PI * 2); ctx.stroke(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, h * 0.3, 0, Math.PI * 2); ctx.stroke(); ctx.translate(-w/2, -h/2); for(let i = 0; i < 25; i++) { let px = ((Math.cos(i * 99) * 0.5 + 0.5) * w) + Math.sin(time + i) * 20; let speed = 15 + (i % 5) * 5; let py = (time * speed + i * 50) % h; ctx.fillStyle = `rgba(255,255,255,${0.3 + (i % 5) * 0.1})`; ctx.beginPath(); ctx.arc(px, py, (i % 3) + 2, 0, Math.PI * 2); ctx.fill(); } }
        else if (theme.id.includes('cyber') || theme.id.includes('matrix')) { ctx.fillStyle = theme.glass; ctx.font = 'bold 16px monospace'; for(let i = 0; i < 40; i++) { let px = (Math.sin(i * 77) * 0.5 + 0.5) * w; let speed = 40 + (i % 5) * 15; let py = (time * speed + i * 80) % h; ctx.fillText(Math.random() > 0.5 ? '1' : '0', px, py); } }
        else if (theme.id.includes('singularity') || theme.id.includes('abyss')) { ctx.translate(w/2, h/2); ctx.strokeStyle = '#9b59b6'; ctx.lineWidth = 15; ctx.beginPath(); ctx.arc(0, 0, h * 0.3, 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, h * 0.28, 0, Math.PI * 2); ctx.fill(); for(let i = 0; i < 8; i++) { ctx.rotate(time * 0.5 + i); ctx.strokeStyle = `rgba(255, 105, 180, ${0.4 - i * 0.05})`; ctx.lineWidth = 30 + i * 10; ctx.beginPath(); ctx.ellipse(0, 0, w * 0.4, h * 0.2, 0, 0, Math.PI * 2); ctx.stroke(); } }
        else if (theme.id.includes('zenith') || theme.id.includes('godrealm')) { ctx.translate(w/2, 0); for(let i = 0; i < 12; i++) { ctx.save(); ctx.rotate(i * Math.PI / 6 + Math.sin(time * 0.5) * 0.1); const grad = ctx.createLinearGradient(0, 0, 0, h); grad.addColorStop(0, 'rgba(255, 215, 0, 0.2)'); grad.addColorStop(1, 'transparent'); ctx.fillStyle = grad; ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(15, 0); ctx.lineTo(120, h); ctx.lineTo(-120, h); ctx.fill(); ctx.restore(); } }
        else { ctx.strokeStyle = theme.grid; ctx.lineWidth = 1; const go = (time * 20) % 40; for (let x = go; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); } for (let y = go; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); } }
        ctx.restore();
    }

    checkUIClick(x, y) {
        if (this.pendingConfirmButtons) {
            const mw = 480, mh = 180, mx = (CANVAS_W-mw)/2, my = (CANVAS_H-mh)/2;
            const btnW = (440 - (this.pendingConfirmButtons.length-1)*15) / this.pendingConfirmButtons.length;
            let clicked = false;
            this.pendingConfirmButtons.forEach((btn, i) => { if (this.isInside(x, y, {x: mx + 20 + i*(btnW+15), y: my + 115, w: btnW, h: 45})) { btn.action(); clicked = true; } });
            if(clicked) return true; return true; 
        }

        const isM = this.showShop || this.showBook || this.showSettings || this.showLabModal;

        if (!isM) {
            if(this.isInside(x,y,this.gatherBtnRect)){ this.gatherAllPets(); return true; }
            if(this.isInside(x,y,this.pauseBtnRect)){ this.pauseState = (this.pauseState + 1) % 3; this.curLabData.isPaused = (this.pauseState === 1); this.sound.playPop(); return true; }
        }

                if(this.isInside(x,y,this.btnSellOneRect)){ if(!s.locked){this.money+=Number(s.value)||0;this.sound.playCoin();this.slimes=this.slimes.filter(sl=>sl!==s);this.selectedSlime=null;this.saveGame();} return true; }

                const exBtn = { x: mx + mw/2 - 150, y: my + 300, w: 300, h: 55 };

            let clk=false;
            TANK_THEMES.slice(0,10).forEach((lab,idx)=>{
                const r=Math.floor(idx/2), c=idx%2, lw=(mw-80)/2, lh=95; const lx=mx+30+c*(lw+20), ly=my+60+r*(lh+12);
                if(this.isInside(x,y,{x:lx+lw-140,y:ly+25,w:125,h:44})){

        if (this.isInside(x, y, {x:380,y:12,w:125,h:44})) { const c=this.getSlotPrice(); if(this.money>=c){this.money-=c;this.maxCapacity++;this.sound.playCoin();this.saveGame();}else showCustomAlert(`Không đủ tiền mở rộng! Cần ${formatMoney(c)}`); return true; }
        if (this.isInside(x, y, {x:515,y:12,w:105,h:44})) { const spds=[0.5,1,1.5,2,3,4,5,6,7]; this.gameSpeed=spds[(spds.indexOf(this.gameSpeed)+1)%spds.length]; this.sound.playPop(); return true; }

        const wX = this.camera.x+(x-(this.containerRect.left+this.containerRect.width/2))/this.camera.zoom;
        const wY = this.camera.y+(y-(this.containerRect.top+this.containerRect.height/2))/this.camera.zoom;

        if (x>=this.containerRect.left&&x<=this.containerRect.right&&y>=this.containerRect.top&&y<=this.containerRect.bottom) {
            if (this.pendingSkin||this.pendingAura) {

                    const s=this.slimes[i];
                    if (Math.hypot(s.x-wX,s.y-wY)<=Math.max(s.radius*1.5,45)) {
                        if(this.pendingSkin){s.customSkin=this.pendingSkin;this.pendingSkin=null;}
                        if(this.pendingAura){s.customAura=this.pendingAura;this.pendingAura=null;}

    }

    isInside(px, py, rect) { return rect && px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h; }

    update(dt) {
        this.bubbles.forEach(b => b.update(this.gameSpeed));
        
        for (let i = this.effects.length - 1; i >= 0; i--) { this.effects[i].update(dt, this.gameSpeed); if (this.effects[i].life <= 0) this.effects.splice(i, 1); }
        if (this.effects.length > 80) this.effects.shift();

        for (let i = this.shockwaves.length - 1; i >= 0; i--) { this.shockwaves[i].update(dt, this.gameSpeed); if (this.shockwaves[i].life <= 0) this.shockwaves.splice(i, 1); }
        if (this.shockwaves.length > 10) this.shockwaves.shift();

        for (let l = 0; l < 10; l++) {
            const lab = this.labsData[l];
            if (!lab || !lab.unlocked || lab.slimes.length === 0) continue;
            
            const theme = TANK_THEMES[l] || TANK_THEMES[0]; const scale = theme.scale || 1.0;
            const labWorldW = this.containerRect.width * 20 * scale; const labWorldH = this.containerRect.height * 20 * scale;
            const labBounds = { left: 0, top: 0, right: labWorldW, bottom: labWorldH };
            const isCurrent = (l === this.currentLabId); const nB = [], sS = [];
            
            lab.slimes.forEach(s => {
                const r = s.update(dt, labBounds, this.effects, this.shockwaves, this.gameSpeed, lab.isPaused, isCurrent);
                if (r === "DEAD") { if (isCurrent) this.effects.push(new Shockwave(s.x, s.y, '#ff4646')); return; }
                sS.push(s); if (r) nB.push({ child: r, parent: s }); 
            });
            
            lab.slimes = sS;
            for (let item of nB) { 
                const nb = item.child; const parent = item.parent;
                if (lab.slimes.length < lab.maxCapacity) {
                    if (nb.strain.isGod) {
                        const godCount = lab.slimes.filter(x => x.strain.id === nb.strain.id).length;
                        if (godCount >= 4) {
                            if (parent.strain.id === nb.strain.id) {
                                if (Math.random() < 0.05) {
                                    parent.level += 1; parent.radius = 32 + parent.level * 3.5; 
                                    const baseVal = Math.floor(Math.random() * 400) + 450; const lm = 1 + (l * 1.5);
                                    parent.value = Math.floor(baseVal * Math.pow(1.65, parent.level - 1) * (parent.strain.valMult || 1) * lm);
                                    if (isCurrent) this.shockwaves.push(new Shockwave(parent.x, parent.y, '#ffd700'));
                                }
                            }
                            continue; 
                        }
                    }
                    lab.slimes.push(nb);
                    if (isCurrent && !this.collection[nb.strain.id] && !this.pendingDiscoveryQueue.find(x=>x.id===nb.strain.id)) { this.pendingDiscoveryQueue.push(nb.strain); }
                } else break; 
            }
        }

        if (!this.pendingConfirmButtons && this.pendingDiscoveryQueue.length > 0) {
            const newM = this.pendingDiscoveryQueue.shift();
            this.confirmModalTitle = `✨ ĐỘT BIẾN MỚI TÌM THẤY!`; this.confirmModalSubtitle = `Phát hiện: ${newM.name}. Thêm vào sách?`;
            this.pendingConfirmButtons = [
                { text: "Thêm vào Sách", bg: "#14503c", action: () => { this.collection[newM.id]=true; this.sound.playMutate(); this.saveGame(); this.pendingConfirmButtons=null; } },
                { text: "Bỏ qua", bg: "#283c50", action: () => { this.pendingConfirmButtons=null; } }
            ];
        }
        
       if (performance.now() - this.lastSaveTime > 4000) { this.saveGame(); this.lastSaveTime = performance.now(); }
        
        // Làm mới UI 1.5s một lần (giảm lag) và CHỈ LÀM MỚI KHI KHÔNG BỊ CHẠM
        this.uiTimer = (this.uiTimer || 0) + dt;
        if (this.uiTimer > 1.5) {
            if (!this.isPressingStrain) this.updateStrainManagerUI();
            this.uiTimer = 0;
        }
    } // Đóng hàm update(dt)

        this.ctx.fillStyle = COLOR_TEXT; this.ctx.font = "bold 14px Arial"; this.ctx.fillText(`Âm lượng: ${Math.round(this.sound.volume * 100)}%`, p.x + 20, p.y + 36);
        this.drawButton({ x: p.x + p.w - 110, y: p.y + 15, w: 40, h: 30 }, "#283c50", null, "-", "#fff", "bold 16px Arial"); this.drawButton({ x: p.x + p.w - 60, y: p.y + 15, w: 40, h: 30 }, "#283c50", null, "+", "#fff", "bold 16px Arial");
        this.drawButton({ x: p.x + 20, y: p.y + 55, w: 340, h: 40 }, this.sound.musicPlaying ? "#1e5064" : "#5a2828", null, this.sound.musicPlaying ? "🎵 Nhạc: BẬT" : "🔇 Nhạc: TẮT", "#fff", "bold 13px Arial");
        this.drawButton({ x: p.x + 20, y: p.y + 105, w: 340, h: 44 }, "#14503c", COLOR_ACCENT, "☁️ Lưu Lên Đám Mây", "#fff", "bold 13px Arial");
        this.drawButton({ x: p.x + 20, y: p.y + 158, w: 340, h: 44 }, "#a06414", COLOR_GOLD, "✏️ Đổi Tên (10Tr)", "#fff", "bold 13px Arial");
        this.drawButton({ x: p.x + 20, y: p.y + 211, w: 340, h: 44 }, "#1e648c", COLOR_ACCENT, "🚪 Đăng Xuất", "#fff", "bold 13px Arial");
        this.drawButton({ x: p.x + 20, y: p.y + 264, w: 340, h: 44 }, "#a02832", COLOR_WARNING, "🗑️ Xóa Tài Khoản", "#fff", "bold 13px Arial");
    }

    drawBookModal() {
        const mx = 40, my = 25, mw = CANVAS_W - 80, mh = 670;
        this.ctx.fillStyle = "#0e1520"; this.ctx.fillRect(mx, my, mw, mh); this.ctx.strokeStyle = "#aa5aff"; this.ctx.lineWidth = 2.5; this.ctx.strokeRect(mx, my, mw, mh);
        const cL = TANK_THEMES[this.currentLabId] || TANK_THEMES[0]; const sts = LAB_STRAIN_SETS[this.currentLabId] || LAB_STRAIN_SETS[0];
        this.ctx.fillStyle = "#dcbeff"; this.ctx.font = "bold 22px Arial"; this.ctx.fillText(`📖 BÁCH KHOA: ${cL.name.toUpperCase()}`, mx + 25, my + 36);
        sts.slice(this.bookPage * 8, this.bookPage * 8 + 8).forEach((s, i) => {
            const cx = mx + 25 + (i % 4) * 320, cy = my + 55 + Math.floor(i / 4) * 265; const u = Boolean(this.collection[s.id]);
            this.ctx.fillStyle = u ? "#162234" : "#101620"; this.ctx.fillRect(cx, cy, 300, 250); this.ctx.strokeStyle = u ? s.color : "#283444"; this.ctx.lineWidth = u ? 2 : 1.5; this.ctx.strokeRect(cx, cy, 300, 250);
            if (u) {
                this.ctx.fillStyle = s.color; this.ctx.beginPath(); this.ctx.arc(cx + 55, cy + 55, 26, 0, Math.PI * 2); this.ctx.fill();
                this.ctx.fillStyle = "#fff"; this.ctx.beginPath(); this.ctx.arc(cx + 48, cy + 52, 5.5, 0, Math.PI * 2); this.ctx.arc(cx + 62, cy + 52, 5.5, 0, Math.PI * 2); this.ctx.fill();
                this.ctx.fillStyle = "#111"; this.ctx.beginPath(); this.ctx.arc(cx + 48, cy + 52, 2.5, 0, Math.PI * 2); this.ctx.arc(cx + 62, cy + 52, 2.5, 0, Math.PI * 2); this.ctx.fill();
                this.ctx.font = "bold 15px Arial"; this.ctx.fillStyle = s.color; this.ctx.fillText(s.name, cx + 98, cy + 36);
                this.ctx.fillStyle = COLOR_GOLD; this.ctx.font = "bold 12.5px Arial"; this.ctx.fillText(`Bậc ${s.tier} | x${formatMoney(s.valMult)}`, cx + 98, cy + 56);
                this.ctx.fillStyle = "#00ffc8"; this.ctx.font = "bold 12px Arial"; this.ctx.fillText("✓ ĐÃ SƯU TẦM", cx + 18, cy + 105);
                this.ctx.fillStyle = "#b0c4de"; this.ctx.font = "11.5px Arial"; this.ctx.fillText(s.desc || "", cx + 18, cy + 132);
            } else {
                this.ctx.fillStyle = "#1e293b"; this.ctx.beginPath(); this.ctx.arc(cx + 55, cy + 55, 26, 0, Math.PI * 2); this.ctx.fill();
                this.ctx.font = "bold 20px Arial"; this.ctx.fillStyle = "#64748b"; this.ctx.textAlign = "center"; this.ctx.textBaseline = "middle"; this.ctx.fillText("🔒", cx + 55, cy + 55); this.ctx.textAlign = "start"; this.ctx.textBaseline = "alphabetic";
                this.ctx.font = "bold 15px Arial"; this.ctx.fillText("Chưa Mở", cx + 98, cy + 36); this.ctx.font = "12px Arial"; this.ctx.fillText(`Bậc ${s.tier || '?'} | Bí ẩn`, cx + 98, cy + 56);
                this.ctx.fillStyle = "#ff4646"; this.ctx.font = "bold 11.5px Arial"; this.ctx.fillText("🔒 CHƯA CÓ", cx + 18, cy + 105);
            }
        });
        const tp = Math.max(1, Math.ceil(sts.length / 8));
        this.drawButton({ x: mx + 30, y: my + mh - 50, w: 150, h: 40 }, this.bookPage > 0 ? "#283c50" : "#1a2430", null, "◀ Trang trước", "#fff", "bold 13px Arial");
        this.drawButton({ x: mx + mw - 180, y: my + mh - 50, w: 150, h: 40 }, this.bookPage < tp - 1 ? "#283c50" : "#1a2430", null, "Trang sau ▶", "#fff", "bold 13px Arial");
        this.drawButton({ x: mx + mw - 50, y: my + 12, w: 38, h: 38 }, COLOR_WARNING, null, "✕", "#fff", "bold 16px Arial");
    }

    draw() {
        this.ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
        const cT = TANK_THEMES.find(t => t.id === this.activeTheme) || TANK_THEMES[0];
        this.ctx.fillStyle = COLOR_GOLD; this.ctx.font = "bold 18px Arial"; 
        this.ctx.fillText(this.diamonds>0 ? `💎 ${this.diamonds}` : `💰 ${formatMoney(this.money)}`, 20, 28);
        this.ctx.fillStyle = "#7890a8"; this.ctx.font = "12px Arial"; this.ctx.fillText(`Người chơi: ${this.playerName || "Vô danh"} | Lab ${this.currentLabId + 1}: ${cT.name}`, 20, 48);
        
        this.drawButton({ x: 380, y: 12, w: 125, h: 44 }, "#a06414", COLOR_GOLD, `+1 Ô (${formatMoney(this.getSlotPrice())})`, "#fff", "bold 11px Arial");
        this.drawButton({ x: 515, y: 12, w: 105, h: 44 }, "#19283c", COLOR_ACCENT, `⚡ ${this.gameSpeed.toFixed(1)}x`, "#e6f5ff", "bold 12px Arial");
        this.drawButton({ x: 633, y: 12, w: 111, h: 44 }, "#8e44ad", "#d2b4de", "🔬 Lab", "#fff", "bold 13px Arial");
        this.drawButton({ x: CANVAS_W - 645, y: 12, w: 190, h: 44 }, "#14503c", COLOR_ACCENT, "➕ Mua Thể Thực (1k)", "#e6f5ff", "bold 13px Arial");
        this.drawButton({ x: CANVAS_W - 445, y: 12, w: 140, h: 44 }, "#5a2d82", "#be6eff", "🛒 Cửa Hàng", "#f0dcff", "bold 13px Arial");
        this.drawButton({ x: CANVAS_W - 295, y: 12, w: 160, h: 44 }, "#372350", "#be6eff", "📖 Sách Sưu Tầm", "#f0dcff", "bold 13px Arial");
        this.drawButton({ x: CANVAS_W - 125, y: 12, w: 110, h: 44 }, "#19283c", COLOR_ACCENT, "⚙ Cài Đặt", "#e6f5ff", "bold 13px Arial");

        const cr = this.containerRect;
        this.drawDynamicBackground(this.ctx, cT, cr.width, cr.height, cr.left, cr.top);
        this.ctx.save(); this.ctx.beginPath(); this.ctx.rect(cr.left, cr.top, cr.width, cr.height); this.ctx.clip();
        this.ctx.save(); this.ctx.translate(cr.left + cr.width / 2, cr.top + cr.height / 2); this.ctx.scale(this.camera.zoom, this.camera.zoom); this.ctx.translate(-this.camera.x, -this.camera.y);
        
        this.bubbles.forEach(b => b.draw(this.ctx)); this.shockwaves.forEach(sw => sw.draw(this.ctx)); this.slimes.forEach(s => s.draw(this.ctx)); this.effects.forEach(e => e.draw(this.ctx));
        this.ctx.restore(); this.ctx.restore();

        const mO = this.showShop || this.showBook || this.showSettings || this.showLabModal;
        this.gatherBtnRect = { x: cr.left + 20, y: cr.bottom - 55, w: 110, h: 38 };
        this.drawButton(this.gatherBtnRect, mO ? "#1a2430" : "#123b32", mO ? "#334155" : COLOR_ACCENT, "🌀 Tập Hợp", mO ? "#64748b" : "#fff", "bold 13px Arial");
        this.pauseBtnRect = { x: cr.right - 180, y: cr.bottom - 55, w: 165, h: 38 };
        const pText = this.pauseState === 0 ? "▶ Chạy Bình Thường" : (this.pauseState === 1 ? "⏸ Dừng Bể Này" : "🎯 Chọn Dừng Lẻ");
        const pColor = this.pauseState === 0 ? "#a05a14" : (this.pauseState === 1 ? "#8e44ad" : "#e056fd");
        this.drawButton(this.pauseBtnRect, mO ? "#2a3442" : pColor, mO ? "#475569" : "#ffd700", pText, mO ? "#64748b" : "#fff", "bold 12px Arial");
        
        this.ctx.fillStyle = COLOR_TEXT; this.ctx.font = "bold 14px Arial"; 
        this.ctx.fillText(`${this.slimes.length}/${this.maxCapacity}`, cr.left + 220, cr.top + 30);
        
        this.ctx.fillStyle = "#28374b"; this.ctx.fillRect(cr.left, cr.top, cr.width, 16); this.ctx.fillRect(cr.left, cr.bottom - 16, cr.width, 16);
        this.ctx.strokeStyle = cT.glass; this.ctx.lineWidth = 2.5; this.ctx.strokeRect(cr.left, cr.top, cr.width, cr.height);

        if (this.selectedSlime) this.drawFloatingActionPanel();
        if (this.showSettings) this.drawSettingsModal();
        if (this.showBook) this.drawBookModal();
        if (this.showShop) this.drawShopModal();
        if (this.showLabModal) this.drawLabListModal();
        
        if (this.pendingConfirmButtons) this.drawCustomConfirm(this.confirmModalTitle, this.confirmModalSubtitle);
    }

    updateStrainManagerUI() {
        const lab = this.labsData[this.currentLabId]; const listDiv = document.getElementById('strain-list');
        if (!lab || !listDiv) return;
        const groups = {};
        lab.slimes.forEach(s => {
            if (!groups[s.strain.id]) groups[s.strain.id] = { strain: s.strain, slimes: [], highestLv: 0 };
            groups[s.strain.id].slimes.push(s);
            if (s.level > groups[s.strain.id].highestLv) groups[s.strain.id].highestLv = s.level;
        });
        const sortedGroups = Object.values(groups).sort((a, b) => b.strain.tier - a.strain.tier);
        listDiv.innerHTML = '';
        sortedGroups.forEach(g => {
            const isLocked = this.lockedStrains[g.strain.id];
            const div = document.createElement('div');
            div.style.cssText = `background: ${isLocked ? '#2c3e50' : '#1e3246'}; color: ${g.strain.color}; padding: 7px; border-radius: 4px; font-size: 11px; cursor: pointer; display: flex; justify-content: space-between; border: 1px solid ${isLocked ? '#f1c40f' : 'transparent'}; transition: 0.1s; user-select: none;`;
            div.innerHTML = `<span>${isLocked ? '🔒 ' : ''}Bậc ${g.strain.tier}: ${g.strain.name}</span> <span>(x${g.slimes.length})</span>`;
            
            // Xử lý chống trượt và nhận diện Nhấn/Giữ chuẩn xác
            // Xử lý chống trượt và cấm vẽ lại UI khi đang chạm
            let pressTimer;
            let isLongPress = false;
            let startY = 0;

            div.onpointerdown = (e) => {
                this.isPressingStrain = true; // Khóa cấm vẽ lại bảng
                isLongPress = false;
                startY = e.clientY;
                div.style.transform = "scale(0.95)"; 
                
                pressTimer = setTimeout(() => {
                    isLongPress = true; 
                    this.lockedStrains[g.strain.id] = !this.lockedStrains[g.strain.id];
                    showCustomAlert(this.lockedStrains[g.strain.id] ? `🔒 Đã khóa chủng [${g.strain.name}]` : `🔓 Đã mở khóa [${g.strain.name}]`, "info");
                    this.isPressingStrain = false; // Xử lý xong, mở khóa vẽ lại
                    this.updateStrainManagerUI(); 
                    pressTimer = null;
                }, 2000); 
            };

            div.onpointermove = (e) => {
                // Hủy nếu vuốt tay trượt quá 10px
                if (Math.abs(e.clientY - startY) > 10) {
                    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
                    this.isPressingStrain = false; 
                    div.style.transform = "scale(1)";
                }
            };

            div.onpointerup = (e) => {
                div.style.transform = "scale(1)";
                this.isPressingStrain = false; // Mở khóa vẽ lại
                if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
                
                // Nếu bấm 1 lần (nhả tay trước 2 giây)
                if (!isLongPress) {
                    if (!this.lockedStrains[g.strain.id]) {
                        // 1. Nếu chủng CHƯA KHÓA -> Mở bảng tùy chọn bán
                        this.openSellModal(g.strain.id, g.strain.name);
                    } else {
                        // 2. Nếu chủng ĐÃ KHÓA -> Tự động Bán tất cả và Giữ lại các Pet max level
                        this.executeSell(g.strain.id, true);
                    }
                }
            };

            div.onpointerleave = () => { 
                div.style.transform = "scale(1)"; 
                this.isPressingStrain = false; // Mở khóa vẽ lại
                if(pressTimer) { clearTimeout(pressTimer); pressTimer = null; } 
            };
            listDiv.appendChild(div);
        });
    }

    openSellModal(strainId, strainName) {
        document.getElementById('sell-modal').style.display = 'flex';
        document.getElementById('sell-modal-title').innerText = `Bán: ${strainName}`;
        document.getElementById('btn-sell-all').onclick = () => { this.executeSell(strainId, false); document.getElementById('sell-modal').style.display = 'none'; };
        document.getElementById('btn-sell-keep-highest').onclick = () => { this.executeSell(strainId, true); document.getElementById('sell-modal').style.display = 'none'; };
    }

    executeSell(strainId, keepHighest) {
        const lab = this.labsData[this.currentLabId]; 
        let totalValue = 0;
        
        // BƯỚC 1: Tìm mức Level cao nhất của chủng này (trong số các con chưa khóa)
        let maxLevel = 0;
        if (keepHighest) {
            lab.slimes.forEach(s => {
                if (s.strain.id === strainId && !s.locked && s.level > maxLevel) {
                    maxLevel = s.level;
                }
            });
        }
        
        // BƯỚC 2: Bắt đầu lọc để Bán / Giữ lại
        lab.slimes = lab.slimes.filter(s => {
            if (s.strain.id === strainId && !s.locked) {
                // Nếu chế độ giữ được bật VÀ con pet này đạt mức Max Level -> Giữ lại toàn bộ
                if (keepHighest && s.level === maxLevel) { 
                    return true; // KHÔNG XÓA
                } 
                
                // Các con cấp thấp hơn sẽ bị bán
                totalValue += s.value || 0;
                if (this.currentLabId === this.currentLabId) this.effects.push(new Shockwave(s.x, s.y, '#f1c40f')); 
                return false; // XÓA
            }
            return true;
        });

        if (totalValue > 0) { 
            this.money += totalValue; 
            this.sound.playCoin(); 
            showCustomAlert(`💰 Đã bán thu về ${formatMoney(totalValue)}`, "success"); 
            this.saveGame(); 
        } else if (keepHighest) {
            // Nếu không bán được đồng nào (do tất cả đều là level cao nhất)
            showCustomAlert(`Tất cả Pet chủng này đều đang ở cấp cao nhất (Lv.${maxLevel}) nên đã được giữ lại an toàn!`, "info");
        }
    }

    sellAllNonGods() {
        document.getElementById('strain-manager').style.display = 'none'; 
        this.confirmModalTitle = `⚠️ XÁC NHẬN BÁN TẤT CẢ?`;
        this.confirmModalSubtitle = `(Giữ lại Thần, Pet đang khóa và Chủng đã khóa)`;
        this.pendingConfirmButtons = [
            { text: "Bán Tất Cả", bg: "#c0392b", action: () => {
                const lab = this.labsData[this.currentLabId]; 
                let totalValue = 0;
                lab.slimes = lab.slimes.filter(s => {
                    if (s.strain.isGod || s.locked || this.lockedStrains[s.strain.id]) return true;
                    totalValue += s.value || 0;
                    if (this.currentLabId === this.currentLabId) this.effects.push(new Shockwave(s.x, s.y, '#e74c3c'));
                    return false;
                });
                if (totalValue > 0) { this.money += totalValue; this.sound.playCoin(); showCustomAlert(`🧹 Dọn dẹp thành công! Nhận được ${formatMoney(totalValue)}`, "success"); this.saveGame(); } 
                else { showCustomAlert(`Không có Pet nào hợp lệ để bán!`, "info"); }
                this.pendingConfirmButtons = null; 
            }},
            { text: "Hủy", bg: "#283c50", action: () => { this.pendingConfirmButtons = null; } }
        ];
    }

    start() {
        const loop = (now) => { try { const dt = Math.min((now - this.lastTime) / 1000, 0.1); this.lastTime = now; this.update(dt); this.draw(); } catch (e) { console.error(e); } requestAnimationFrame(loop); };
        requestAnimationFrame(loop);
    }
}

window.addEventListener("load", () => { window.gameInstance = new Game(); });
window.addEventListener("visibilitychange", () => {
    if (document.visibilityState === 'hidden' && window.gameInstance && window.gameInstance.auth && window.gameInstance.auth.currentUser) {
        const localData = localStorage.getItem(window.gameInstance.getSaveKey());
        if (localData) { window.gameInstance.db.ref('gameSaves/' + window.gameInstance.auth.currentUser.uid).set({ saveData: localData, lastUpdated: Date.now() }); }
    }
});
</script>
